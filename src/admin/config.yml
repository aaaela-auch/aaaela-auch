locale: fr
backend:
  name: github
  repo: aaaela-auch/aaaela-auch
  branch: main
  commit_messages:
    update: Mise à jour de {{slug}}
    uploadMedia: Ajout de la photo {{path}}
local_backend: true
site_url: https://aaaela.netlify.app
display_url: https://aaaela.netlify.app
logo_url: /img/logoaaaela.jpg
media_folder: src/img/uploads
public_folder: /img/uploads
collections:
- name: pages
  label: 📄 Pages du site
  description: Cliquez sur une page pour modifier son texte et ses images.
  editor:
    preview: false
  files:
  - name: index
    label: Accueil – texte « Le Lycée »
    file: src/pages/index.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: association
    label: L'Association
    file: src/pages/association.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: publications
    label: Publications
    file: src/pages/publications.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: presidents
    label: Anciens Présidents
    file: src/pages/presidents.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: ca
    label: CA
    file: src/pages/ca.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: statuts
    label: Les Statuts
    file: src/pages/statuts.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: photos
    label: Photos (liens des albums)
    file: src/pages/photos.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: afficher_galerie
      label: Afficher la galerie d'archives sous les albums
      widget: boolean
      default: true
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
