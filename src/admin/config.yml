    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
      widget: hidden
    - name: layout
      widget: hidden
    - name: ordre
      widget: hidden
    - name: body
      label: Contenu de la page
      widget: markdown
      hint: Utilisez la barre d’outils pour mettre en gras, ajouter un titre, un lien
        ou une image.
  - name: actualites
    label: Actualités
    file: src/pages/actualites.md
    fields:
    - name: title
      label: Titre de la page (affiché en haut)
      widget: string
    - name: permalink
